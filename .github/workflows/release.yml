name: release

# Builds the distributable artifacts on their native platforms. This matters:
# a .deb built on Arch links against a much newer glibc than Debian ships, and
# a Windows .exe can't be meaningfully tested from Linux at all.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked
      - name: Package .deb
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: target/debian/*.deb

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked
      - name: Stage installer inputs
        shell: pwsh
        run: |
          Copy-Item target\release\cornelcd.exe packaging\windows\
          Copy-Item target\release\cornelcdw.exe packaging\windows\
      - name: Ensure NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            $p = "${env:ProgramFiles(x86)}\NSIS"
            if (Test-Path "$p\makensis.exe") {
              echo "$p" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            } else {
              choco install nsis -y --no-progress
              echo "$p" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            }
          }
      - name: Build installer
        shell: pwsh
        # makensis resolves relative paths against the working directory, not
        # the script's location, so the ..\..\LICENSE references only work
        # from inside packaging/windows.
        working-directory: packaging/windows
        run: makensis installer.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: packaging/windows/cornelcd-setup.exe

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true

name: release

# Builds the distributable artifacts on their native platforms. This matters:
# a .deb built on Arch links against a much newer glibc than Debian ships, and
# a Windows .exe can't be meaningfully tested from Linux at all.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked
      - name: Package .deb
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: target/debian/*.deb

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked
      - name: Stage installer inputs
        shell: pwsh
        run: Copy-Item target\release\cornelcd.exe packaging\windows\
      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" packaging\windows\installer.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: packaging/windows/cornelcd-setup.exe

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true

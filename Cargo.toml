[package]
name = "cornelcd"
version = "0.1.0"
edition = "2021"
description = "Drive the LCD screens on a Corne Max (Mechboards R2G) keyboard over raw HID"

[dependencies]
hidapi = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Tray, per platform. Linux uses StatusNotifierItem over D-Bus (what waybar,
# GNOME and KDE all speak) so there is no GTK dependency. Windows uses the
# Shell_NotifyIcon wrapper.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.2"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"
# Just enough Win32 for a message pump; tray-icon needs one to deliver events.
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[profile.release]
opt-level = "s"
lto = true

[package.metadata.deb]
maintainer = "Eric Brooks <eric@4oh4.net>"
copyright = "2026, Eric Brooks"
license-file = ["LICENSE", "0"]
extended-description = """\
Drives the LCD screens on a Corne Max (Mechboards R2G) keyboard over raw HID.
Reports what Claude Code is currently doing so the on-board Clawd sprite acts
it out, and shows a tool-use tally. Runs as a tray daemon."""
section = "utils"
priority = "optional"
assets = [
    ["target/release/cornelcd", "usr/bin/", "755"],
    ["packaging/cornelcd.service", "usr/lib/systemd/user/cornelcd.service", "644"],
    ["README.md", "usr/share/doc/cornelcd/README.md", "644"],
]
maintainer-scripts = "packaging/debian"
# Explicit rather than "$auto": dpkg-shlibdeps does not exist on the Arch box
# this is often built from, and $auto silently yields an empty Depends there.
# hidapi is statically linked, so it is deliberately absent.
depends = "libc6, libgcc-s1, libudev1, libdbus-1-3, libsystemd0"

[package]
name = "cornelcd"
version = "0.1.0"
edition = "2021"
description = "Drive the LCD screens on a Corne Max (Mechboards R2G) keyboard over raw HID"

[dependencies]
hidapi = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = "s"
lto = true
